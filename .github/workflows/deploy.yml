name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 30s
          command_timeout: 30m
          script_stop: true
          script: |
            # 进入项目目录
            cd /root/polysniper

            # 先拉取最新代码（确保 deploy.sh 存在）
            git pull origin main

            # 给脚本添加执行权限
            chmod +x deploy.sh

            # 执行部署脚本
            ./deploy.sh
